# 찰랑찰랑 예약 사이트: app (PHP 8.4 + Apache) + database (MariaDB 10.11, same as the live server).
#
#   cp docker/.env.example docker/.env    # then fill in the passwords and the address
#   docker compose -f docker/docker-compose.yml --env-file docker/.env up -d --build
#
# Data lives in the named volumes "db-data" (database) and "app-storage" (logs, sessions, uploads, backups).

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: crcr-booking:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      BASE_URL: ${BASE_URL:?set BASE_URL in docker/.env}
      LANGUAGE: korean
      DEBUG_MODE: "false"
      DB_HOST: db
      DB_NAME: ${DB_NAME:-easyappointments}
      DB_USERNAME: ${DB_USERNAME:-easyappointments}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in docker/.env}
      KAKAO_JAVASCRIPT_KEY: ${KAKAO_JAVASCRIPT_KEY:-}
      TZ: Asia/Seoul
    volumes:
      - app-storage:/var/www/html/storage

  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-easyappointments}
      MARIADB_USER: ${DB_USERNAME:-easyappointments}
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in docker/.env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in docker/.env}
      TZ: Asia/Seoul
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - db-data:/var/lib/mysql
      # Optional: put a dump of the live database here to load it on the first start (empty volume only).
      - ./initdb:/docker-entrypoint-initdb.d:ro
    # The database is not published to the host; only the app container can reach it.

volumes:
  db-data:
  app-storage:
