# Apache settings for the 찰랑찰랑 booking container.

ServerTokens Prod
ServerSignature Off
TraceEnable Off

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Internal folders: never served directly (the app's own .htaccess files also deny them).
<DirectoryMatch "^/var/www/html/(application|system|storage|vendor)">
    Require all denied
</DirectoryMatch>

# Dot files (.env, .git, .htaccess ...) and config / composer files.
<FilesMatch "^\.">
    Require all denied
</FilesMatch>
<FilesMatch "^(config\.php|config-sample\.php|composer\.(json|lock)|CHANGELOG\.md|README\.md|LICENSE)$">
    Require all denied
</FilesMatch>

# index.php is the only PHP entry point.
<FilesMatch "\.php$">
    Require all denied
</FilesMatch>
<Files "index.php">
    Require all granted
</Files>
