# Builds the Docker image (docker/Dockerfile) and publishes it:
#   - GitHub Container Registry: ghcr.io/<owner>/<repo>  (always, uses the built-in GITHUB_TOKEN)
#   - Docker Hub: <DOCKERHUB_IMAGE>                         (only when the DOCKERHUB_* settings below exist)
#
# Tags: "latest" (main branch), "sha-<commit>", and "1.2.3" / "1.2" for git tags like v1.2.3.
#
# Docker Hub (optional): repository Settings → Secrets and variables → Actions
#   secrets:   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (an access token, not the password)
#   variable:  DOCKERHUB_IMAGE (e.g. myname/crcr-booking)

name: Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
    # Pushes that only change documentation or the deploy compose files do not rebuild the image.
    paths-ignore: ['**.md', 'LICENSE', 'docker/docker-compose*.yml', 'docker/.env.example']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      USE_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' && vars.DOCKERHUB_IMAGE != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.USE_DOCKERHUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image names and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ env.USE_DOCKERHUB == 'true' && vars.DOCKERHUB_IMAGE || '' }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # amd64 for most NAS / servers, arm64 for ARM NAS models and Raspberry Pi.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
